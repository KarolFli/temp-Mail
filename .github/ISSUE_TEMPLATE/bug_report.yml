name: 🐞 Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Send an email to …
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: dropdown
    id: deploy
    attributes:
      label: How do you run it?
      options: [Docker, Node.js (npm start), Development (npm run dev)]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
